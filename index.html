<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GLOBZ — Free For All</title>
  <meta name="description" content="Play GLOBZ Free-For-All. Eat, split, grow, and dominate!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- Start Screen -->
  <div id="startScreen">
    <div class="start-card">
      <h1 class="logo">GLOB<span class="logo-dot">Z</span></h1>
      <p class="subtitle">Free-For-All</p>
      <div class="class-selection" id="classSelection">
        <div class="class-card active" data-class="phantom">
          <h3>Phantom</h3>
          <p>Space: Phase Dash</p>
        </div>
        <div class="class-card" data-class="juggernaut">
          <h3>Juggernaut</h3>
          <p>Space: EMP Shockwave</p>
        </div>
        <div class="class-card" data-class="scavenger">
          <h3>Scavenger</h3>
          <p>Passive: 2x Magnet Pull</p>
        </div>
      </div>
      <input type="text" id="nameInput" placeholder="Enter your name" maxlength="15" autocomplete="off" autofocus>
      <div class="btn-row">
        <button id="playBtn">▶ PLAY</button>
        <button id="settingsBtn" class="icon-btn" title="Settings">⚙</button>
      </div>
    </div>
  </div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- Post Processing Overlay -->
  <div id="crtOverlay"></div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="hidden">
    <div class="settings-card">
      <h2>Settings</h2>
      <div class="settings-row">
        <label>CRT Scanlines</label>
        <input type="checkbox" id="crtToggle" checked>
      </div>
      <div class="settings-row">
        <label>High Graphics (Glow & Particles)</label>
        <input type="checkbox" id="glowToggle" checked>
      </div>
      <div class="settings-row">
        <label>Master Volume</label>
        <input type="range" id="volSlider" min="0" max="1" step="0.1" value="0.5">
      </div>
      <button id="closeSettingsBtn">Close</button>
    </div>
  </div>

  <!-- HUD Overlay -->
  <div id="hud" class="hidden">
    <div id="scoreBar">
      <span id="scoreLevel">Lvl 1 • Cell</span>
      <span id="scoreValue">0</span>
    </div>
    <div id="leaderboard">
      <h3>🏆 Leaderboard</h3>
      <ol id="lbList"></ol>
    </div>
    <canvas id="minimap" width="180" height="180"></canvas>
  </div>

  <!-- Death Screen -->
  <div id="deathScreen" class="hidden">
    <div class="death-card">
      <h2>💀 Game Over</h2>
      <p class="death-msg">You were consumed!</p>
      <div class="death-stats">
        <div class="stat-row"><span class="stat-label">Score</span><span id="finalScore" class="stat-value">0</span>
        </div>
        <div class="stat-row"><span class="stat-label">Time Alive</span><span id="timeAlive"
            class="stat-value">0:00</span></div>
        <div class="stat-row"><span class="stat-label">Best Rank</span><span id="topPosition"
            class="stat-value">-</span></div>
      </div>
      <button id="respawnBtn">▶ PLAY AGAIN</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
